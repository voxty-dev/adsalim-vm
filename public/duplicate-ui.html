<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdsAlim VM — Bulk Duplicate</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0b1220; color: #e5e7eb; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p { color: #94a3b8; line-height: 1.5; }
    label { display: block; font-size: 0.85rem; margin: 14px 0 6px; color: #cbd5e1; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #111827; color: #f8fafc; }
    textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 8px; background: #06b6d4; color: #042f2e; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { margin-top: 20px; padding: 14px; border-radius: 8px; background: #111827; border: 1px solid #334155; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; min-height: 120px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>Bulk Duplicate (VM direct)</h1>
    <p>Bypasses adsalim.com / Vercel timeout. Runs up to 20 Smart+ copies on the VM with live progress.</p>

    <label>VM secret (Bearer token)</label>
    <input id="secret" type="password" placeholder="Same as TIKTOK_VM_SECRET / SHARED_SECRET" />

    <div class="row">
      <div>
        <label>Advertiser ID</label>
        <input id="advertiserId" placeholder="7559481394611798032" />
      </div>
      <div>
        <label>Source campaign ID</label>
        <input id="campaignId" placeholder="1863630626273666" />
      </div>
    </div>

    <label>Names (one per line, max 20)</label>
    <textarea id="names" placeholder="Copy 6 of PRST TR G1&#10;Copy 7 of PRST TR G1"></textarea>

    <label>TikTok cookies (string or JSON array)</label>
    <textarea id="cookies" placeholder="sessionid_ads=...; csrftoken=..."></textarea>

    <button id="run">Start duplicate</button>
    <div id="log">Ready.</div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = (msg, cls) => {
      const el = $("log");
      el.textContent += (el.textContent === "Ready." ? "" : "\n") + msg;
      if (cls) el.className = cls;
    };

    $("run").addEventListener("click", async () => {
      const secret = $("secret").value.trim();
      const advertiserId = $("advertiserId").value.trim();
      const campaignId = $("campaignId").value.trim();
      const cookies = $("cookies").value.trim();
      const names = $("names").value.split("\n").map((s) => s.trim()).filter(Boolean);
      $("log").textContent = "";
      $("run").disabled = true;

      if (!secret || !advertiserId || !campaignId || !cookies || !names.length) {
        log("Fill all fields.", "err");
        $("run").disabled = false;
        return;
      }
      if (names.length > 20) {
        log("Max 20 names.", "err");
        $("run").disabled = false;
        return;
      }

      try {
        log(`Starting ${names.length} copies…`);
        const start = await fetch("/duplicate/async", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${secret}`,
          },
          body: JSON.stringify({ advertiserId, campaignId, names, cookies }),
        });
        const startBody = await start.json();
        if (!start.ok) throw new Error(startBody.error || start.statusText);
        const jobId = startBody.jobId;
        log(`Job ${jobId} running…`);

        while (true) {
          await new Promise((r) => setTimeout(r, 2500));
          const poll = await fetch(`/duplicate/jobs/${jobId}`, {
            headers: { Authorization: `Bearer ${secret}` },
          });
          const job = await poll.json();
          if (!poll.ok) throw new Error(job.error || poll.statusText);
          log(
            `[${job.phase || job.status}] ${job.progress?.done || 0}/${job.progress?.total || names.length}` +
              (job.published != null ? ` published=${job.published}` : "")
          );
          if (job.status === "completed" || job.status === "failed") {
            const ok = (job.results || []).filter((r) => r.ok).length;
            log(`Done: ${ok}/${job.total || names.length} ok`, ok ? "ok" : "err");
            if (job.results) {
              for (const r of job.results) {
                log(`${r.ok ? "✓" : "✗"} ${r.name}${r.error ? " — " + r.error : ""}`);
              }
            }
            break;
          }
        }
      } catch (e) {
        log(String(e.message || e), "err");
      } finally {
        $("run").disabled = false;
      }
    });
  </script>
</body>
</html>
